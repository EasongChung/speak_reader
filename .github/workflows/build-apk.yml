name: Build Android APK & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: 检查工具链
        run: |
          flutter --version
          java -version
          ./android/gradlew --version

      - name: 按锁文件获取依赖
        run: flutter pub get --enforce-lockfile

      - name: 检查 Dart 格式
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 运行测试
        run: flutter test

      - name: 构建 arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 校验并重命名 APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$SOURCE"
          VERSION=$(perl -ne 'print $1 if /^version:\s*([^+\s]+)/' pubspec.yaml)
          test -n "$VERSION"
          DEST="build/app/outputs/flutter-apk/speak-reader-${VERSION}-${GITHUB_SHA::7}-arm64-v8a.apk"
          mv "$SOURCE" "$DEST"
          sha256sum "$DEST"
          ls -lh "$DEST"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: 读取标签信息
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        shell: bash
        run: |
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Speak Reader ${{ steps.tag.outputs.name }}
          body: |
            Speak Reader Android APK
            版本: ${{ steps.tag.outputs.name }}
            架构: arm64-v8a
            构建日期: ${{ steps.tag.outputs.date }}
            工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false
