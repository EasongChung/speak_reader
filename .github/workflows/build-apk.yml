name: Build Android APK & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 检查 Flutter
        run: flutter doctor --version

      # ============================================================
      # flutter create 生成标准 Groovy Android 脚手架
      # 恢复自定义资源后，追加 build-optimizations.gradle 到 app/build.gradle
      # 确保 Flutter 校验 100% 通过（标准 Groovy 格式）
      # ============================================================
      - name: 生成标准 Android 脚手架
        run: |
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          flutter create --org com.example --project-name speak_reader --platforms=android . 2>&1
          cd "$OLDPWD"
          rm -rf android/
          cp -r "$TMPDIR/android" .
          chmod +x android/gradlew
          rm -rf "$TMPDIR"
          echo "===== 标准 Gradle 结构 ====="
          ls -la android/ android/app/

      - name: 恢复自定义资源 + 注入优化配置
        run: |
          # 恢复被 rm -rf android/ 删除的自定义文件（不包含 build.gradle 等脚手架文件）
          git checkout android/app/src/main/
          git checkout android/app/build-optimizations.gradle
          git checkout android/app/proguard-rules.pro
          # 升级 Kotlin 版本（flutter_tts 要求较新版本，flutter create 生成的 1.7.10 太旧）
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          # 追加体积优化配置
          cat android/app/build-optimizations.gradle >> android/app/build.gradle
          echo "===== 注入后的 app/build.gradle ====="
          cat android/app/build.gradle

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: |
          # 注意: 不传 --split-per-abi (与 abiFilters 冲突), abiFilters 已在 build.gradle 中配置
          flutter build apk --release
          ls build/app/outputs/flutter-apk/

      - name: 重命名 APK
        run: |
          VERSION="2.4.0"
          if [ -d ".git" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/speak-reader-${VERSION}-arm64-v8a.apk 2>/dev/null || true

      - name: 上传 APK(Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk
          path: build/app/outputs/flutter-apk/speak-reader-*.apk

      - name: 判断是否为标签推送
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 发布到 Releases
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speak Reader ${{ github.ref_name }}
          body: |
            📱 Speak Reader APK 构建
            版本: ${{ github.ref_name }}
            架构: arm64-v8a (精简版)
            构建日期: ${{ steps.check-tag.outputs.date }}
            [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false