name: Build Android APK & Release

# 手动触发、推送到 main 分支，或推送 v 标签时自动打包
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 发布 Release 需要写入权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 检查 Flutter
        run: flutter doctor --version

      # ============================================================
      # 关键步骤: 备份自定义配置 → flutter create 生成脚手架 → 恢复
      # flutter create 会生成 gradlew, gradle-wrapper.jar, settings.gradle 等
      # 但也会覆盖我们的 build.gradle.kts 和 styles.xml, 所以要恢复
      # ============================================================
      - name: 备份自定义 Android 配置
        run: |
          cp android/app/build.gradle.kts /tmp/build.gradle.kts.bak
          cp android/app/src/main/res/values/styles.xml /tmp/styles.xml.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak 2>/dev/null || true
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro.bak 2>/dev/null || true

      - name: 生成标准 Gradle 脚手架
        run: |
          # 在临时目录创建临时 Flutter 项目, 只取 android/ 目录
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          flutter create --org com.example --project-name speak_reader --platforms=android . 2>&1
          # 复制 gradle wrapper 文件到项目
          cd "$OLDPWD"
          cp -r "$TMPDIR/android/gradle" android/
          cp "$TMPDIR/android/gradlew" android/gradlew
          cp "$TMPDIR/android/gradlew.bat" android/gradlew.bat 2>/dev/null || true
          chmod +x android/gradlew
          # 复制项目级 gradle 配置
          cp "$TMPDIR/android/build.gradle" android/build.gradle 2>/dev/null || true
          cp "$TMPDIR/android/settings.gradle" android/settings.gradle 2>/dev/null || true
          cp "$TMPDIR/android/gradle.properties" android/gradle.properties 2>/dev/null || true
          # 复制本地 properties (sdk 路径)
          cp "$TMPDIR/android/local.properties" android/local.properties 2>/dev/null || true
          rm -rf "$TMPDIR"

      - name: 恢复自定义 Android 配置
        run: |
          cp /tmp/build.gradle.kts.bak android/app/build.gradle.kts
          cp /tmp/styles.xml.bak android/app/src/main/res/values/styles.xml
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp /tmp/proguard-rules.pro.bak android/app/proguard-rules.pro 2>/dev/null || true
          echo "===== Android 项目结构 ====="
          ls -la android/
          ls -la android/app/
          ls -la android/gradle/wrapper/

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: |
          flutter build apk --release --split-per-abi
          ls build/app/outputs/flutter-apk/

      - name: 重命名 APK
        run: |
          VERSION="2.4.0"
          if [ -d ".git" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/speak-reader-${VERSION}-arm64-v8a.apk 2>/dev/null || true
          # 也尝试 product flavor 路径
          mv build/app/outputs/flutter-apk/app-arm64-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/speak-reader-${VERSION}-arm64-v8a.apk 2>/dev/null || true

      - name: 上传 APK(Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk
          path: build/app/outputs/flutter-apk/speak-reader-*.apk

      # 仅在推送标签(v*)时创建 GitHub Release
      - name: 判断是否为标签推送
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 发布到 Releases
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speak Reader ${{ github.ref_name }}
          body: |
            📱 Speak Reader APK 构建
            版本: ${{ github.ref_name }}
            分支: ${{ github.ref_name }}
            架构: arm64-v8a (精简版)
            构建日期: ${{ steps.check-tag.outputs.date }}
            [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false

      - name: 清理
        run: echo "done"