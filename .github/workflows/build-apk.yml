name: Build Android APK & Release

# 手动触发、推送到 main 分支，或推送 v 标签时自动打包
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 发布 Release 需要写入权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 检查 Flutter
        run: flutter doctor --version

      # Flutter项目已包含完整的Android结构，不需要重新create
      # 这里只验证flutter能正常读取项目

      - name: 获取依赖
        run: flutter pub get

      # [v2.4.0] build.gradle.kts 已内置 compileSdk=36 + minify + arm64 flavor
      # 无需在 CI 中 sed 修改, 直接构建即可

      - name: 构建 Release APK
        run: |
          # 使用 --split-per-abi 只生成 arm64-v8a（最大体积节省）
          flutter build apk --release --split-per-abi
          # 确认生成了 arm64 的apk
          ls build/app/outputs/flutter-apk/

      - name: 重命名 APK
        run: |
          VERSION="2.4.0"  # 从git tag获取更佳
          if [ -d ".git" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          ls -la build/app/outputs/flutter-apk/*.apk || echo "APK not found yet, building may need adjustment"
          # 重命名
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/speak-reader-${VERSION}-arm64-v8a.apk 2>/dev/null || true

      - name: 上传 APK(Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk
          path: build/app/outputs/flutter-apk/speak-reader-*.apk

      # 仅在推送标签(v*)时创建 GitHub Release
      - name: 判断是否为标签推送
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # 注：由于是fork仓库且workflow_dispatch手动触发时才可能运行，
      # softprops/action-gh-release需要有repository_write权限
      - name: 发布到 Releases
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speak Reader ${{ github.ref_name }}
          body: |
            📱 Speak Reader APK 构建
            版本: ${{ github.ref_name }}
            分支: ${{ github.ref_name }}
            架构: arm64-v8a (精简版)
            构建日期: ${{ steps.check-tag.outputs.date }}
            [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false

      # Post步骤：清理
      - name: 清理
        run: echo "done"