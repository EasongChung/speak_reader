name: Build Android APK & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 检查 Flutter
        run: flutter doctor --version

      # ============================================================
      # flutter create 生成标准 Groovy Android 脚手架
      # 恢复自定义资源后，追加 build-optimizations.gradle 到 app/build.gradle
      # 确保 Flutter 校验 100% 通过（标准 Groovy 格式）
      # ============================================================
      - name: 生成标准 Android 脚手架
        run: |
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          flutter create --org com.example --project-name speak_reader --platforms=android . 2>&1
          cd "$OLDPWD"
          rm -rf android/
          cp -r "$TMPDIR/android" .
          chmod +x android/gradlew
          rm -rf "$TMPDIR"
          echo "===== 标准 Gradle 结构 ====="
          ls -la android/ android/app/

      - name: 恢复自定义资源 + 注入优化配置
        run: |
          git checkout android/app/src/main/
          # 追加体积优化配置（从独立文件读取，避免 YAML heredoc 解析问题）
          cat android/app/build-optimizations.gradle >> android/app/build.gradle
          echo "===== 注入后的 app/build.gradle ====="
          cat android/app/build.gradle

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: |
          flutter build apk --release --split-per-abi
          ls build/app/outputs/flutter-apk/

      - name: 重命名 APK
        run: |
          VERSION="2.4.0"
          if [ -d ".git" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" | sed 's/^app-//; s/-release.apk$//')
            mv "$apk" "build/app/outputs/flutter-apk/speak-reader-${VERSION}-${base}.apk"
          done

      - name: 上传 APK(Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk
          path: build/app/outputs/flutter-apk/speak-reader-*.apk

      - name: 判断是否为标签推送
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 发布到 Releases
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speak Reader ${{ github.ref_name }}
          body: |
            📱 Speak Reader APK 构建
            版本: ${{ github.ref_name }}
            架构: arm64-v8a (精简版)
            构建日期: ${{ steps.check-tag.outputs.date }}
            [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false