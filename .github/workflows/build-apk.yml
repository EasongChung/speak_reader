name: Build Android APK & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 检查 Flutter
        run: flutter doctor --version

      # ============================================================
      # 备份自定义配置 → 临时目录 flutter create 生成完整 Android 脚手架
      # → 复制到项目 → 恢复自定义配置
      # ============================================================
      - name: 备份自定义 Android 配置
        run: |
          mkdir -p /tmp/android-bak
          cp android/app/build.gradle.kts /tmp/android-bak/
          cp android/app/src/main/res/values/styles.xml /tmp/android-bak/
          cp android/app/src/main/AndroidManifest.xml /tmp/android-bak/ 2>/dev/null || true
          cp android/app/proguard-rules.pro /tmp/android-bak/ 2>/dev/null || true

      - name: 生成标准 Android 脚手架
        run: |
          # 在临时目录创建完整 Flutter 项目以获取标准 android/ 目录
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          flutter create --org com.example --project-name speak_reader --platforms=android . 2>&1
          # 删除项目级 KTS 文件(避免与 Groovy 文件冲突)
          rm -f "$TMPDIR/android/build.gradle.kts" "$TMPDIR/android/settings.gradle.kts"
          # 复制整个 android/ 目录回项目(覆盖所有手写文件)
          cd "$OLDPWD"
          rm -rf android/
          cp -r "$TMPDIR/android" .
          chmod +x android/gradlew
          rm -rf "$TMPDIR"
          echo "===== 生成的标准文件 ====="
          ls -la android/ android/app/

      - name: 恢复自定义配置
        run: |
          cp /tmp/android-bak/build.gradle.kts android/app/build.gradle.kts
          cp /tmp/android-bak/styles.xml android/app/src/main/res/values/styles.xml
          cp /tmp/android-bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp /tmp/android-bak/proguard-rules.pro android/app/proguard-rules.pro 2>/dev/null || true
          # 删除生成的 app 级 Groovy build.gradle(我们的 KTS 优先)
          rm -f android/app/build.gradle
          echo "===== 恢复后的结构 ====="
          ls -la android/ android/app/
          echo "----- app/build.gradle or kts? -----"
          ls android/app/build.gradle* 2>/dev/null || echo "no build.gradle*"

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: |
          flutter build apk --release --split-per-abi
          ls build/app/outputs/flutter-apk/

      - name: 重命名 APK
        run: |
          VERSION="2.4.0"
          if [ -d ".git" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          # --split-per-abi 生成 app-arm64-v8a-release.apk
          # 若有 product flavor 则生成 app-arm64-arm64-v8a-release.apk
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" | sed 's/^app-//; s/-release.apk$//')
            mv "$apk" "build/app/outputs/flutter-apk/speak-reader-${VERSION}-${base}.apk"
          done

      - name: 上传 APK(Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: speak-reader-apk
          path: build/app/outputs/flutter-apk/speak-reader-*.apk

      - name: 判断是否为标签推送
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 发布到 Releases
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speak Reader ${{ github.ref_name }}
          body: |
            📱 Speak Reader APK 构建
            版本: ${{ github.ref_name }}
            架构: arm64-v8a (精简版)
            构建日期: ${{ steps.check-tag.outputs.date }}
            [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/speak-reader-*-arm64-v8a.apk
          draft: false
          prerelease: false