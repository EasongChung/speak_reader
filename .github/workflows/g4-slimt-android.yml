name: G4.2/G4.3 slimt Android arm64 交叉编译 + JNI 链接 (PoC)

# [G4.2] 用 Android NDK 把 slimt 交叉编译成 arm64-v8a 的静态/共享库。
# [G4.3] 再把 android/app/src/main/cpp/slimt_jni.cpp 与 slimt 静态库链成
#        单个 libslimt_jni.so —— 这才是最终交付进 jniLibs 的产物。
#        单 .so 的理由见「编译 libslimt_jni.so」步骤的注释(方案 A)。
#
# 前置: G4.1 已通过(run 31172293077) —— 上游未改动的 slimt 能正确加载
# 中英 base 模型双向翻译:
#   zh->en  HF mukowaty/firefox-translations zh-en/(单词表)      译文干净
#   en->zh  GCS cjk_hplt2_lr0003_70x30_*(单词表)                 译文可用
# 故本阶段只解决**交叉编译**, 不再验证模型正确性。
#
# 与 g4-slimt-poc.yml 并存而非替换: 后者是 x86_64 回归基线,
# 编译选项与本文件不同(AVX2 vs NEON), 两条线要能各自独立复跑。
#
# ⚠️ 为什么带 push 触发器: workflow_dispatch 要求文件存在于**默认分支**
# 才会出现在 Actions UI。docs/13 §6 规定 G4.1~G4.4 全过前不合入 main,
# 故只能靠 push 到 G4 分支自触发。
on:
  push:
    branches: [g4-offline-translate]
    paths:
      - '.github/workflows/g4-slimt-android.yml'
      # [G4.3] JNI 源码也要触发: 它由本 workflow 编译, 改了不重编等于没改。
      - 'android/app/src/main/cpp/**'
  workflow_dispatch:

jobs:
  slimt-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # 与 android/app/build.gradle 的 ndkVersion 一致(第 43 行), 不可漂移:
      # 用别的版本编出来的 .so 在真机上可能因 libc++ ABI 差异崩。
      NDK_VERSION: '27.0.12077973'
      # abiFilters 只留 arm64-v8a(build.gradle 第 73 行), 故只编这一档。
      ANDROID_ABI: 'arm64-v8a'
      # ⚠️ 锁定 28, 已探底确认这是 slimt 能编通的**最低档**, 不要改小。
      #
      # 探底结论(run 31180887218, matrix 同跑 21/28, fail-fast:false):
      #   android-21 单一错误, 且全仓仅此一处 ——
      #     slimt/Aligned.cc:51:10: error:
      #       use of undeclared identifier 'aligned_alloc'
      #   aligned_alloc 是 C11 函数, Android Bionic **从 API 28 才提供**。
      #   同轮 28 档正常通过, 排除环境漂移。
      #
      # ⚠️ 修正此前的错误猜测: 最初选 28 的理由写的是「21 缺 getauxval 等
      # NEON 运行时探测符号, ruy/xsimd 对老 API level 支持不稳」—— 这是错的。
      # ruy / xsimd / gemmology / pcre2 / sentencepiece 在 21 上全部编过,
      # 唯一障碍是一个内存分配 API 的可用性, 与 SIMD、与后端选型都无关。
      #
      # 已决定不改 slimt 源码(posix_memalign 替换虽仅 4 行且语义等价,
      # 但会打破「上游零改动」)。minSdk 保持 21 不动, 离线翻译在
      # G4.3 按 Build.VERSION.SDK_INT >= 28 做特性开关, 老机型走在线链路。
      ANDROID_PLATFORM: 'android-28'

    steps:
      - name: 检出 G4 分支
        uses: actions/checkout@v4

      - name: 核对 build.gradle 中的 NDK 与 ABI 配置
        run: |
          set -uo pipefail
          echo "--- android/app/build.gradle 相关行(确认 env 未漂移):"
          grep -nE 'ndkVersion|minSdk|targetSdk|compileSdk|abiFilters' \
            android/app/build.gradle || true
          echo
          echo "workflow env: NDK=$NDK_VERSION ABI=$ANDROID_ABI PLATFORM=$ANDROID_PLATFORM"
          # 只告警不阻断: 版本不一致时要人看见, 但不影响本轮探路。
          grep -q "$NDK_VERSION" android/app/build.gradle \
            && echo "  [ok] NDK 版本与 build.gradle 一致" \
            || echo "  [warn] NDK 版本与 build.gradle 不一致, 注意 ABI 兼容性"

      - name: 安装指定版本 NDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          # runner 自带若干 NDK, 但不一定有我们要的版本, 用 sdkmanager 精确装。
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --install "ndk;$NDK_VERSION" >/dev/null 2>&1 || true
          NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT" || { echo "NDK 目录不存在: $NDK_ROOT"; ls -1 "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          TC="$NDK_ROOT/build/cmake/android.toolchain.cmake"
          test -f "$TC" || { echo "toolchain 文件缺失: $TC"; exit 1; }
          echo "ANDROID_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "--- toolchain: $TC"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -2

      # 宿主侧只需要 cmake/ninja/git; sentencepiece/pcre2/BLAS 一律不装 ——
      # 本轮刻意走「全内置」把外部依赖降到 0(docs/13 §G4.2 建议路径)。
      - name: 安装构建工具 (不装任何目标侧依赖)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config
          cmake --version
          ninja --version

      # ⚠️ 第 4 轮起 WITH_GEMMOLOGY=OFF, 本步骤产物**本轮用不到**。
      # 仍保留: header-only 不进 libslimt.so 的 NEEDED 段, 成本仅几秒;
      # 而门禁备选路径 1(换回 gemmology) 一旦要用它就得在, 删了再加更费事。
      #
      # 上一轮 configure 曾挂在这: CMakeLists.txt:137 是
      # find_package(xsimd REQUIRED), 而 xsimd **不是** vendored 依赖 ——
      # 3rd-party/ 只有 gemmology/intgemm/ruy/sentencepiece 四个 submodule。
      # G4.1 时它来自系统包 libxsimd-dev, 交叉编译时目标侧没有。
      #
      # xsimd 是 header-only, 交叉编译零成本: 只要 install 出
      # xsimdConfig.cmake 供 find_package 走 CMAKE_PREFIX_PATH 找到即可,
      # 不产生任何需要链接的二进制, 也不会进 libslimt.so 的 NEEDED 段。
      #
      # 版本对齐 noble 的 libxsimd-dev(13.x): gemmology 用的
      # xsimd::neon64 与 arch_list API 在 13 系稳定; xsimd 12 及更早
      # 的 arch 命名不同, 会让 Gemmology.cc:17 的 neon64 分支编不过。
      - name: 准备 xsimd (header-only, 交叉编译无成本)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 13.0.0 \
            https://github.com/xtensor-stack/xsimd.git "$RUNNER_TEMP/xsimd"
          cd "$RUNNER_TEMP/xsimd"
          # header-only: 这里只是为了生成 xsimdConfig.cmake, 不编任何代码,
          # 故**不需要** toolchain —— 用宿主 cmake 装头文件即可。
          cmake -B build -S . -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/xsimd-install" \
            -DBUILD_TESTS=OFF >/dev/null
          cmake --install build >/dev/null
          echo "XSIMD_ROOT=$RUNNER_TEMP/xsimd-install" >> "$GITHUB_ENV"
          echo "--- 装出的 config 文件(find_package 靠它):"
          find "$RUNNER_TEMP/xsimd-install" -name 'xsimd*.cmake' -o -name 'xsimd*Config*.cmake' | head
          echo "--- 确认 neon64 头文件在(Gemmology.cc:17 要用):"
          find "$RUNNER_TEMP/xsimd-install" -path '*neon64*' -name '*.hpp' | head -3

      # ⚠️ 第 2 轮 build 挂在这: ninja 报
      #   'lib/libpcre2-8.a', needed by 'slimt/libslimt.so', missing and
      #   no known rule to make it
      # 根因**不是**交叉编译, 是 slimt 内置 pcre2 路径在 Ninja 下本身不成立:
      # cmake/FindPCRE2.cmake:71-73 把 lib/libpcre2-8.a 硬写进
      # INTERFACE_LINK_LIBRARIES, 但 :76-85 的 ExternalProject_Add **没有**
      # BUILD_BYPRODUCTS(全仓 grep 无此关键字)。CMake 对纯路径 link item 会
      # 登记成文件依赖, Ninja 要求每个输入文件都有产出规则 -> 生成期通过
      # (configure 退出码 0, 只打印了下载消息), 构建期立刻报错。
      # 上游 .github/workflows/ 只有 main.yml, 没有 Android 线, 这条路没人走过。
      #
      # 故改走 SLIMT_USE_INTERNAL_PCRE2=OFF + 自己交叉编静态库, 让
      # FindPCRE2.cmake:95-102 的 find_library/find_path 分支去找 ——
      # 与 xsimd 完全对称, **slimt 源码零改动**(方案 A 是 sed 补
      # BUILD_BYPRODUCTS, 会破坏「上游未改动」这个 G4.1 结论, 不取)。
      # 附带好处: 内置路径要在 slimt build 目录里再套一层 cmake, NDK
      # toolchain 靠 :55 手工转发, 转发链长了更难查; 自己编只有一层。
      - name: 准备 pcre2 (交叉编译静态库)
        run: |
          set -euo pipefail
          # 版本对齐 FindPCRE2.cmake:12 的 10.43, 避免与上游预期的 API 漂移。
          git clone --depth 1 --branch pcre2-10.43 \
            https://github.com/PCRE2Project/pcre2.git "$RUNNER_TEMP/pcre2"
          cd "$RUNNER_TEMP/pcre2"
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pcre2-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF \
            -DPCRE2_SUPPORT_JIT=OFF >/dev/null
          cmake --build build-android --parallel >/dev/null
          cmake --install build-android >/dev/null
          echo "PCRE2_ROOT=$RUNNER_TEMP/pcre2-install" >> "$GITHUB_ENV"
          echo "--- 装出的产物(find_library 要靠 NAMES pcre2-8 命中 libpcre2-8.a):"
          ls -l "$RUNNER_TEMP/pcre2-install/lib/" | grep -E '\.a$|\.so' || true
          test -f "$RUNNER_TEMP/pcre2-install/include/pcre2.h" \
            && echo "  [ok] pcre2.h 在(find_path 要用)" \
            || { echo "  [FAIL] 缺 pcre2.h"; exit 1; }
          echo "--- 确认是 aarch64 而非宿主 x86_64(防 toolchain 没生效):"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj" \
            --file-headers "$RUNNER_TEMP/pcre2-install/lib/libpcre2-8.a" \
            2>/dev/null | grep -m1 -E 'Machine|Arch' || \
            file "$RUNNER_TEMP/pcre2-install/lib/libpcre2-8.a"

      # PCRE2_SUPPORT_JIT=OFF 的取舍: aarch64 上 pcre2 JIT 可用, 但 Android
      # 对可执行 mmap(W^X)有限制, 真机上更容易出问题; 而 ssplit 的正则只用于
      # 断句, G4.1 已证实它**切不了中文**(nonbreaking_prefix.en 是英文前缀表,
      # 对「。」不起作用), 断句本来就留在 Dart 侧 TtsService。故关掉 JIT
      # 换稳定性, 无性能损失。

      - name: 克隆 slimt
        run: |
          set -euo pipefail
          # 固定到 G4.1 验证过的 commit, 避免上游漂移让两阶段结论对不上。
          # 上游近乎停更(作者已转向 lemonade), 固定版本无维护成本。
          git clone --recursive https://github.com/jerinphilip/slimt.git "$RUNNER_TEMP/slimt"
          cd "$RUNNER_TEMP/slimt"
          git checkout 9f0b1a20d14871cc94dbe65b7a3df128e5e81f55
          git submodule update --init --recursive
          echo "slimt HEAD: $(git rev-parse HEAD)"
          echo "--- 3rd-party 子模块(确认内置依赖已就位):"
          git submodule status || true
          ls -1 3rd-party/ 2>/dev/null || true

      # ============================================================
      # 交叉编译 — 全内置组合
      # ============================================================
      # 选项名以 CMakeLists.txt 实测为准(G4.1 日志第 13-36 行), 不照抄文档:
      #   USE_NEON=ON                aarch64 SIMD, 替代 x86 的 AVX2/SSSE3/SSE2
      #   USE_BUILTIN_SENTENCEPIECE  默认已是 ON, 显式写出防上游改默认值
      #   SLIMT_USE_INTERNAL_PCRE2   ⚠️ 两点:
      #                              (1) 名字是 SLIMT_ 前缀不是 SSPLIT_,
      #                                  docs/13 §G4.2 写成 SSPLIT_ 是错的;
      #                              (2) 本轮改为 **OFF** —— ON 的内置路径在
      #                                  Ninja 下必挂(见上方 pcre2 步骤注释),
      #                                  改用预编好的 arm64 静态库。
      #   PCRE2_LIBRARIES /          直接预置 find_library/find_path 的**结果
      #   PCRE2_INCLUDE_DIR          变量**: 已在 cache 里就跳过搜索, 这样
      #                              runner 若自带 x86_64 libpcre2-dev 也绝无
      #                              可能被误命中(交叉编译时链进宿主架构静态库
      #                              会在链接期才报 incompatible, 很难查)。
      #                              FindPCRE2.cmake:103 判的就是这两个变量。
      #   BUILD_SHARED=ON            我们要的就是 libslimt.so
      #   WITH_TESTS=OFF             默认 OFF, 交叉编译跑不了测试
      #
      # ⚠️⚠️ int8 后端**三选一**, 不可同开 —— 第 3 轮挂在这:
      #   QMM.cc:30:20: error: redefinition of 'kProvider'
      # QMM.cc:12/21/30 在**同一个** namespace slimt::qmm::detail 里各定义一次
      # `constexpr Provider kProvider`, 分别由 SLIMT_HAS_INTGEMM /
      # SLIMT_HAS_RUY / SLIMT_HAS_GEMMOLOGY 三个独立 #ifdef 守卫。同开两个宏
      # 就是同一符号定义两次。ruy 是 gemmology 的**替代**而非补充。
      # 佐证: 上游 CI(main.yml:212)的组合是
      #   -DBLA_VENDOR=OpenBLAS -DWITH_GEMMOLOGY=ON -DUSE_AVX2=ON ...
      # 即 WITH_BLAS 保持默认 ON + gemmology, **完全不碰 WITH_RUY**。
      #
      # 且 WITH_RUY 一个开关绑死两件事, 无法拆开(CMakeLists.txt:131-134):
      #   list(APPEND SLIMT_COMPILE_DEFINITIONS SLIMT_HAS_RUY)  # 宏
      #   list(APPEND SLIMT_PRIVATE_LIBS ruy)                   # 链接
      # 而 3rd-party/CMakeLists.txt:49-51 也只在 WITH_RUY 时 add_subdirectory。
      # 故本轮取:
      #   WITH_BLAS=OFF + WITH_RUY=ON + WITH_GEMMOLOGY=OFF
      #     fp32: TensorOps.cc:22 在 !SLIMT_HAS_BLAS 时 #include "ruy/ruy.h",
      #           :396 的 #else 用 ruy 实现 matrix_multiply —— 注意该文件
      #           **只认 SLIMT_HAS_BLAS, 从不看 SLIMT_HAS_RUY**, 所以 fp32
      #           走 ruy 是自动的; WITH_RUY=ON 的作用是让 ruy 真的被编译链接
      #           (否则 #include 找不到头 + 链接期缺符号)。
      #     int8: QMM.cc:18 的 SLIMT_HAS_RUY 分支 + Ruy.inl.cc
      #   代价: xsimd 白装(无害, header-only 不进 NEEDED); int8 性能未知,
      #         但 ruy 是 Google 为 ARM 手写 NEON 内核的库, arm64 上不见得
      #         比 gemmology 慢。若性能不达标, 回退方案见门禁输出。
      #
      # 注: gemmology 关掉后, 下面这条 NEON 对齐结论本轮用不上, 保留备查 ——
      # Gemmology.cc:17 只声明 arch_list<neon64> 单档, 第 77-88 行也只实例化
      # neon64, 两处口径一致(x86 侧是 #elif 级联声明三档但 #ifdef 各自独立,
      # 才要三个开关一起开)。将来若换回 gemmology 直接开 USE_NEON 即可。
      - name: 配置交叉编译 (全内置依赖)
        id: configure
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$XSIMD_ROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DPCRE2_LIBRARIES="$PCRE2_ROOT/lib/libpcre2-8.a" \
            -DPCRE2_INCLUDE_DIR="$PCRE2_ROOT/include" \
            -DWITH_GEMMOLOGY=OFF \
            -DUSE_NEON=ON \
            -DUSE_BUILTIN_SENTENCEPIECE=ON \
            -DSLIMT_USE_INTERNAL_PCRE2=OFF \
            -DWITH_BLAS=OFF \
            -DWITH_RUY=ON \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=ON \
            -DWITH_TESTS=OFF 2>&1 | tee "$RUNNER_TEMP/configure.log"
          rc="${PIPESTATUS[0]}"
          echo "--- configure 退出码: $rc"
          echo
          echo "--- 确认只启用了一个 int8 后端(防 kProvider 重定义复发):"
          grep -cE 'SLIMT_HAS_(RUY|GEMMOLOGY|INTGEMM)' \
            build-android/CMakeCache.txt 2>/dev/null || true
          grep -E '^WITH_(RUY|GEMMOLOGY|INTGEMM|BLAS):' \
            build-android/CMakeCache.txt 2>/dev/null || true
          echo
          echo "--- CMake Error 摘要(便于下一轮定位):"
          grep -nE 'CMake Error|Could NOT find|Configuring incomplete' \
            "$RUNNER_TEMP/configure.log" | head -20 || echo "(无错误)"
          exit "$rc"

      - name: 编译 libslimt.so
        id: build
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          test -d build-android || { echo "configure 未成功, 跳过编译"; exit 1; }
          cmake --build build-android --parallel 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc="${PIPESTATUS[0]}"
          echo "--- build 退出码: $rc"
          echo
          echo "--- 首批错误(便于下一轮定位, 不必翻全日志):"
          grep -nE 'error:|fatal error:|undefined reference|No such file' \
            "$RUNNER_TEMP/build.log" | head -30 || echo "(无错误行)"
          exit "$rc"

      # ============================================================
      # [G4.3] 把 JNI 适配层与 slimt 静态库链成单个 libslimt_jni.so
      # ============================================================
      # ⚠️ 为什么是**单** .so (docs/13 §G4.3 方案 A, 2026-08-07 用户确认):
      # 上一步产出的 libslimt.so 的 NEEDED 段没有 libc++_shared.so, 即 STL
      # 静态链入。若 JNI 层另编一个 .so 去链它, JNI 层会带自己那份静态 STL,
      # 而 slimt 的对外 API 重度使用 std::string/std::vector/std::shared_ptr
      # (Blocking::translate 签名), 这些类型跨 .so 边界传递时两份静态 STL
      # 各有独立 type_info/异常表/全局状态, 属未定义行为。把 JNI 边界改成
      # 纯 C **救不了** —— 问题在 JNI 层与 libslimt 之间, 不在与 Java 之间。
      #
      # ⚠️ 为什么不用 add_subdirectory 把 slimt 并进一个 CMake 工程:
      # slimt/CMakeLists.txt:111-112 的 include 目录写的是 ${CMAKE_SOURCE_DIR}
      # 与 ${CMAKE_BINARY_DIR}(**全局根**, 不是 CURRENT_*)。一旦 slimt 变成
      # 子目录, 这两个变量会指向我们的工程根, slimt 自己的 .cc 就找不到
      # slimt/Frontend.hh 和生成的 Export.hh。绕开它要改上游, 违反零改动。
      # 故保持 slimt 顶层独立编译, 这里单独调 clang++ 链接。
      - name: 编译 libslimt_jni.so (JNI 适配层 + slimt 静态库)
        id: build_jni
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          LLVM_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$LLVM_BIN/aarch64-linux-android${ANDROID_PLATFORM#android-}-clang++"
          test -x "$CXX" || { echo "找不到编译器: $CXX"; ls "$LLVM_BIN" | head -20; exit 1; }
          echo "--- 编译器: $CXX"
          "$CXX" --version | head -2
          echo

          JNI_SRC="$GITHUB_WORKSPACE/android/app/src/main/cpp/slimt_jni.cpp"
          test -f "$JNI_SRC" || { echo "JNI 源码缺失: $JNI_SRC"; exit 1; }

          # ⚠️ 第 6 轮根因: 只给 -I<slimt 根> 和 -I<build 目录> 不够 ——
          #   slimt/Vocabulary.hh:9 直接 include "sentencepiece_processor.h",
          #   它在 3rd-party/sentencepiece/src/ 下, 属 slimt 的**私有** include
          #   目录, 不在公共头搜索路径里。而 slimt 的公共头(Frontend.hh ->
          #   Model.hh -> Vocabulary.hh)会把它拽进任何包含者的 TU。
          #
          # 手工维护 -I 清单是本项目已知的坑型(自己写的清单会随上游漂移而过期),
          # 故改为从 CMake 导出的 compile_commands.json 里**抄** slimt 自己某个
          # TU 的全部 -I/-isystem/-D, 与 slimt 本体逐字节同源。上游零改动。
          CCJ="build-android/compile_commands.json"
          test -f "$CCJ" || { echo "缺 $CCJ, 检查 CMAKE_EXPORT_COMPILE_COMMANDS"; exit 1; }
          # 抽取脚本单独成文件而非内嵌 heredoc: heredoc 的终止符必须顶到列 0,
          # 会直接破坏 YAML 块标量的缩进(本轮已踩), 且外置后可本地单测。
          mapfile -t INCS < <(
            python3 "$GITHUB_WORKSPACE/.github/scripts/extract_slimt_includes.py" "$CCJ"
          )
          [ "${#INCS[@]}" -gt 0 ] || { echo "未能从 $CCJ 抽出 include 口径"; exit 1; }
          echo "--- 沿用 slimt 本体的 ${#INCS[@]} 个 include/define 参数:"
          printf '%s\n' "${INCS[@]}"
          echo

          # slimt 的静态库 + ruy 拆出的几十个 .a 全量收集。手工列不现实,
          # 且 ruy 的产物名随版本变动, find 收全比维护清单可靠。
          mapfile -t ARCHIVES < <(find build-android -name '*.a' -type f | sort)
          echo "--- 收集到 ${#ARCHIVES[@]} 个静态库:"
          printf '%s\n' "${ARCHIVES[@]}" | head -20
          [ "${#ARCHIVES[@]}" -gt 0 ] || { echo "未找到任何 .a, 检查 BUILD_STATIC"; exit 1; }
          echo

          # -static-libstdc++: 与 G4.2 的 libslimt.so 口径一致, STL 静态链入,
          #   不引入 libc++_shared.so 运行时依赖。
          # --start-group/--end-group: slimt 与 ruy 之间存在循环符号引用,
          #   单遍链接会漏解析。
          # -Wl,--no-undefined: 让缺符号在**链接期**就报错, 而不是拖到真机
          #   dlopen 时才 UnsatisfiedLinkError —— 那时排查成本高得多。
          # -fvisibility=default 仅作用于本文件: slimt 顶层 CMakeLists.txt:10
          #   设了 visibility hidden, 但 JNI 入口必须导出才能被 dlsym 找到。
          #   (JNIEXPORT 本身已带 visibility("default"), 这里是双保险。)
          "$CXX" -shared -fPIC -O2 -std=c++20 \
            -fvisibility=default \
            "${INCS[@]}" \
            -o build-android/libslimt_jni.so \
            "$JNI_SRC" \
            -Wl,--start-group "${ARCHIVES[@]}" -Wl,--end-group \
            -static-libstdc++ \
            -Wl,--no-undefined \
            -llog -lm -ldl 2>&1 | tee "$RUNNER_TEMP/jni.log"
          rc="${PIPESTATUS[0]}"
          echo "--- JNI 链接退出码: $rc"
          echo
          echo "--- 首批错误:"
          grep -nE 'error:|fatal error:|undefined symbol|undefined reference' \
            "$RUNNER_TEMP/jni.log" | head -30 || echo "(无错误行)"
          exit "$rc"

      # strip 是 docs/13 §G4.3 结转的第 1 条前置要求: 未 strip 的 libslimt.so
      # 有 22MB, 其中约 17.7MB 是 .debug* 段。此处顺带把实测值打进日志回填文档。
      - name: strip 调试段
        id: strip
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          LLVM_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO="build-android/libslimt_jni.so"
          test -f "$SO" || { echo "产物缺失: $SO"; exit 1; }
          BEFORE="$(stat -c%s "$SO")"
          "$LLVM_BIN/llvm-strip" --strip-debug "$SO"
          AFTER="$(stat -c%s "$SO")"
          echo "=== strip 前后体积(用于回填 docs/13 §G4.3):"
          echo "  strip 前: $BEFORE 字节 ($((BEFORE / 1024 / 1024)) MB)"
          echo "  strip 后: $AFTER 字节 ($((AFTER / 1024 / 1024)) MB)"
          echo "  减少:     $((BEFORE - AFTER)) 字节"

      # 通过标准(docs/13 §G4.2): file 确认是 ELF 64-bit LSB shared object,
      # ARM aarch64。只看「编译成功」不够 —— 要防 toolchain 没生效编成了 x86_64。
      - name: 验证产物架构
        id: verify
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          echo "--- 所有 libslimt* 产物:"
          find build-android -name 'libslimt*' -print 2>/dev/null || true
          # [G4.3] 交付物改为 libslimt_jni.so(方案 A 单 .so)。libslimt.so
          # 仍会产出但不再打包 —— 它是 G4.2 的中间产物, JNI 层链的是 .a。
          SO="$(find build-android -name 'libslimt_jni.so' -type f | head -1)"
          if [ -z "$SO" ]; then
            echo "未找到 libslimt_jni.so, 检查 JNI 链接步骤是否成功:"
            find build-android -name 'libslimt*' | head -10
            exit 1
          fi
          echo
          echo "=== file 判定(通过标准):"
          file "$SO"
          file "$SO" | grep -q 'ELF 64-bit LSB shared object' \
            && echo "  [ok] 是 64 位 ELF 共享库" || { echo "  [FAIL] 不是共享库"; exit 1; }
          file "$SO" | grep -qE 'ARM aarch64|aarch64' \
            && echo "  [ok] 是 ARM aarch64" || { echo "  [FAIL] 架构不是 aarch64"; exit 1; }
          echo
          echo "=== 体积(docs/13 预估 6-12MB):"
          ls -lh "$SO"
          echo
          # ⚠️ 第 4 轮这两条命令的输出没进日志: 原写法把 stderr 丢了
          # (nm 那条还显式 2>/dev/null), 且 `cmd | grep || true` 的 || 作用于
          # 整条管道, 工具本身执行失败也会被静默吞掉。改为先探测工具存在,
          # 再让 stderr 可见 —— NEEDED 段直接决定 G4.3 能否 loadLibrary,
          # 不能是个看不见结果的检查。
          LLVM_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "=== 动态依赖(NEEDED 越少越好, 不应出现 libopenblas/libsentencepiece):"
          if [ -x "$LLVM_BIN/llvm-readelf" ]; then
            "$LLVM_BIN/llvm-readelf" --dynamic-table "$SO" 2>&1 \
              | grep -E 'NEEDED|SONAME' || echo "(readelf 无 NEEDED/SONAME 输出)"
          else
            echo "(llvm-readelf 不在 $LLVM_BIN, 回退用 readelf)"
            readelf -d "$SO" 2>&1 | grep -E 'NEEDED|SONAME' \
              || echo "(readelf 也无输出)"
          fi
          echo
          # [G4.3] JNI 入口符号必须**逐个**存在, 且必须是硬门禁 ——
          # 缺一个都会在真机上表现为 UnsatisfiedLinkError: No implementation
          # found for ...。这是最容易出错的一环: 包名 com.example.speak_reader
          # 含下划线, JNI 命名规则要求转义成 _1(speak_1reader), 写成
          # speak_reader 会静默找不到符号, 编译链接全过、装上才崩。
          echo "=== JNI 入口符号(硬门禁, 缺一即失败):"
          if [ -x "$LLVM_BIN/llvm-nm" ]; then
            NM="$LLVM_BIN/llvm-nm"
          else
            NM="nm"
            echo "(llvm-nm 不在 $LLVM_BIN, 回退用 nm)"
          fi
          SYMS="$("$NM" --dynamic --defined-only "$SO" 2>&1 || true)"
          MISSING=0
          for fn in nativeLoad nativeTranslate nativeUnload nativeUnloadAll \
                    nativeLoadedIds; do
            EXPECT="Java_com_example_speak_1reader_SlimtBridge_$fn"
            if printf '%s' "$SYMS" | grep -q "$EXPECT"; then
              echo "  [ok] $EXPECT"
            else
              echo "  [FAIL] 缺符号 $EXPECT"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "实际导出的 Java_* 符号(对照排查转义是否写错):"
            printf '%s' "$SYMS" | grep -E 'Java_' || echo "(一个都没有)"
            exit 1
          fi
          echo
          # ⚠️ 必须写**绝对路径**: upload-artifact 的 path 相对
          # GITHUB_WORKSPACE(仓库检出目录)解析, 而这里 cd 到了
          # $RUNNER_TEMP/slimt。第 4 轮写相对路径导致
          #   "No files were found with the provided path" -> artifact 为空,
          # 而 if-no-files-found: warn 把它降级成 warning, 门禁误判为通过。
          echo "SO_PATH=$(realpath "$SO")" >> "$GITHUB_ENV"

      - name: 上传产物
        id: upload
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          # 单档单 job, 不加后缀。若将来再开 matrix 同跑多个 platform,
          # 必须补 -${{ matrix.platform }} 后缀: 同名 artifact 会撞,
          # 而 overwrite 默认 false, 后跑完的那个会直接失败。
          name: libslimt-jni-arm64-v8a
          path: ${{ env.SO_PATH }}
          # ⚠️ 必须 error 不能 warn: 本 gate 的意义就是拿到可用产物,
          # 找不到文件时静默放过会让门禁出假阳性(第 4 轮就是这么过的)。
          if-no-files-found: error
          retention-days: 14

      - name: G4.3 门禁判定
        if: always()
        run: |
          echo "configure:  ${{ steps.configure.outcome }}"
          echo "build:      ${{ steps.build.outcome }}"
          echo "build_jni:  ${{ steps.build_jni.outcome }}"
          echo "strip:      ${{ steps.strip.outcome }}"
          echo "verify:     ${{ steps.verify.outcome }}"
          echo "upload:     ${{ steps.upload.outcome }}"
          echo
          echo "门禁标准(docs/13 §G4.3): 产出 libslimt_jni.so, file 确认为"
          echo "ELF 64-bit LSB shared object / ARM aarch64, 五个 JNI 入口符号"
          echo "齐备, NEEDED 不含 libc++_shared.so, 并成功上传 artifact。"
          echo
          # ⚠️ 必须同时判 upload: 第 4 轮 verify 通过(.so 确实是 aarch64)但
          # artifact 为空(路径相对基准写错 + if-no-files-found:warn 静默),
          # 只判 verify 就出了假阳性。产物拿不到 = 下一步无从下手 = 没通过。
          echo "编译档: $ANDROID_PLATFORM (已探底确认为 slimt 可编通的最低档)"
          echo
          if [ "${{ steps.verify.outcome }}" = "success" ] \
             && [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "=> 云编译通过。取 artifact libslimt-jni-arm64-v8a, 放到"
            echo "   android/app/src/main/jniLibs/arm64-v8a/libslimt_jni.so,"
            echo "   再本地 flutter build 装真机验证。"
            echo
            echo "   ⚠️ 真机验证要点:"
            echo "   1. 这是 ruy 后端的**首次真实推理**。模型是 intgemm 量化"
            echo "      权重, 而本库编的是 WITH_RUY=ON —— 该组合上游 CI 从未"
            echo "      跑过(上游用 OpenBLAS+gemmology, main.yml:212)。若译文"
            echo "      乱码, 根因属 G4.4 已知风险项, 不是 JNI 写错。"
            echo "   2. Android 9 以下机型应静默走在线链路(SlimtBridge 判定),"
            echo "      设置页开关置灰并显示「需 Android 9 及以上」。"
            echo "   3. 模型经 SAF 选目录导入, 会复制进 app 私有目录 ——"
            echo "      slimt 用 mmap 读真实路径, 不认 content:// URI。"
          else
            echo "=> G4.2 未通过。备选路径(已按累计已排除项更新):"
            echo "   1. 换回 gemmology 后端: WITH_GEMMOLOGY=ON + WITH_RUY=OFF"
            echo "      + WITH_BLAS=ON, 并为 arm64 交叉编 OpenBLAS。这与上游"
            echo "      CI(main.yml:212) 同构, 是唯一被上游验证过的组合,"
            echo "      代价是多编一个 OpenBLAS(当初正为省这一步才选 ruy)"
            echo "   2. ruy 若在 aarch64 编不过, 试固定 ruy 到更早 tag"
            echo "      (它是 slimt 的 submodule, 可单独 checkout)"
            echo "   3. 上述都不行 -> 走 §1.2 bergamot-translator 回退"
            echo
            echo "累计已排除(每轮一条根因, 不重复踩):"
            echo " · 第1轮: xsimd 不是 vendored 依赖 -> 已预装 header-only 包"
            echo " · 第2轮: 「WITH_BLAS=OFF 自动退 ruy」是错的(注释描述源码"
            echo "          行为, CMake 两开关独立) -> 已显式补 WITH_RUY=ON"
            echo " · 第3轮: SLIMT_USE_INTERNAL_PCRE2=ON 在 Ninja 下必挂"
            echo "          (ExternalProject 缺 BUILD_BYPRODUCTS, 而库路径已被"
            echo "          硬写进 INTERFACE_LINK_LIBRARIES) -> 改 OFF + 预编"
            echo "          arm64 静态库, slimt 源码仍零改动"
            echo " · 第4轮: int8 后端三选一, ruy 与 gemmology 同开必然"
            echo "          QMM.cc kProvider 重定义(三个 #ifdef 在同一 namespace"
            echo "          各定义一次) -> 关 GEMMOLOGY, fp32+int8 统一走 ruy"
            echo " · 第5轮: artifact 的 path 以 GITHUB_WORKSPACE 为基准(不是步骤"
            echo "          里 cd 的目录), 加上 if-no-files-found:warn 静默,"
            echo "          门禁出过假阳性 -> 已改 realpath 绝对路径 + error"
            echo " · 第6轮: JNI 层只给 -I<slimt根> 与 -I<build目录> 不够 ——"
            echo "          slimt/Vocabulary.hh:9 include 的"
            echo "          sentencepiece_processor.h 在 3rd-party/sentencepiece/src/,"
            echo "          属 slimt 私有 include 目录, 却被公共头链拽进 TU ->"
            echo "          改为从 compile_commands.json 抄 slimt 本体 TU 的"
            echo "          全部 -I/-isystem/-D, 不再手工维护清单"
            echo " · 探底轮: ANDROID_PLATFORM=21 编不过, 唯一根因是 Aligned.cc:51"
            echo "          的 aligned_alloc(C11, Bionic 从 API 28 才提供),"
            echo "          与 SIMD/后端选型无关 -> 已锁 28, 不要再往下试"
            echo
            echo "本轮错误已在失败步骤末尾摘出首 30 条。"
            echo
            # ⚠️ 第 6 轮新增: 失败分支必须 exit 1。此前门禁只 echo 不退出,
            # 于是 build_jni/verify 明明 failure、upload skipped, run 结论
            # 仍是 success —— 「run 绿灯」与「门禁通过」脱钩, 等于第 5 轮
            # 假阳性的变体(那次是 artifact 空, 这次是结论骗人)。
            exit 1
          fi
