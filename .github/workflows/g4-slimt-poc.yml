name: G4.1 slimt 桌面端验证 (PoC)

# [G4.1] 在 ubuntu-latest (x86_64) 上编译 slimt 并验证中英互译。
#
# 为什么用 CI 而不是本地: 开发机无 cmake/gcc/NDK, WSL 1 挂载失败不可用,
# 且宿主是 Windows ARM64。CI 提供干净的 x86_64 Linux 环境。
#
# 仅在 G4 分支上触发, 不监听 main:
# 本 workflow 是一次性验证探针, 不产出 APK, 不发 Release,
# 与 build-apk.yml 完全独立(后者只监听 main 的 push, G4 分支不会触发它)。
#
# ⚠️ 为什么带 push 触发器: workflow_dispatch 要求 workflow 文件存在于**默认分支**
# 才会出现在 Actions UI / 才能被 gh workflow run 找到。而 docs/13 §6 规定
# G4.1~G4.4 全过前不合入 main, 故只能靠 push 到 G4 分支自触发。
on:
  push:
    branches: [g4-offline-translate]
    paths:
      - '.github/workflows/g4-slimt-poc.yml'
  workflow_dispatch:
    inputs:
      model_pair:
        description: '验证语向: both / zhen / enzh'
        required: false
        default: 'both'

jobs:
  slimt-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出 G4 分支
        uses: actions/checkout@v4

      # slimt 的 CMake 假设这些依赖来自系统包管理器。
      # 桌面端先用系统包把「引擎 + 模型 + 配置」三件套验证对,
      # 交叉编译时再换成内置选项(G4.2 的主要工作量)。
      - name: 安装系统依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          # libprotobuf-dev 是 sentencepiece.pc 的 Requires 依赖来源:
          # sentencepiece.pc 需要 protobuf-lite.pc, 后者由 libprotobuf-dev 提供
          # (noble 上没有独立的 libprotobuf-lite-dev 包 —— 已实测确认)。
          # 缺它时 pkg_check_modules 会报 "Package 'protobuf-lite', required by
          # 'sentencepiece', not found" 进而整体报 sentencepiece 未找到,
          # 是误导性错误: sentencepiece 本身其实已装好。
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libsentencepiece-dev libprotobuf-dev protobuf-compiler \
            libopenblas-dev libpcre2-dev \
            libxsimd-dev zstd
          echo "--- sentencepiece.pc 内容(确认依赖已满足):"
          cat /usr/lib/x86_64-linux-gnu/pkgconfig/sentencepiece.pc 2>/dev/null || \
            find / -name 'sentencepiece.pc' 2>/dev/null | head -3
          # 预检: pkg-config 能解析全部依赖再进 CMake。
          # 否则 CMake 只会报 "sentencepiece not found" 这种指向错误的信息,
          # 真实缺失项被掩盖, 要多烧一轮 CI 才能定位。
          for m in sentencepiece protobuf-lite; do
            pkg-config --exists --print-errors "$m" && echo "  [ok] $m"
          done
          cmake --version
          gcc --version | head -1

      - name: 克隆 slimt
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/jerinphilip/slimt.git "$RUNNER_TEMP/slimt"
          cd "$RUNNER_TEMP/slimt"
          echo "slimt HEAD: $(git rev-parse HEAD)"
          echo "--- 顶层 CMake 选项(供排错参照):"
          grep -nE '^\s*option\(' CMakeLists.txt || true
          echo "--- README 中的模型档位说明:"
          grep -niE 'tiny|base|model' README.md | head -40 || true

      - name: 配置并编译 slimt
        id: build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/slimt"
          # x86_64 桌面: 用 AVX2 + gemmology(xsimd)。
          # aarch64 交叉编译时改为 -DUSE_NEON=ON, 见 docs/13 §1.1。
          #
          # ⚠️ SSSE3/SSE2 必须与 AVX2 一起开, 缺一不可 —— 上一轮只开 USE_AVX2
          # 导致链接失败(undefined reference to gemmology::Engine<xsimd::sse2>
          # 等一批符号)。根因在 slimt/qmm/Gemmology.cc:
          #   第 6-20 行  宏链是 #elif 级联, 开 USE_AVX2 时 SUPPORTED_ARCHS
          #               展开为 arch_list<avx2, ssse3, sse2> —— 运行时按实际
          #               CPU 派发到这三档中任一档, 故三档定义都得在;
          #   第 24-88 行 显式实例化却是各自独立的 #ifdef, 只开 USE_AVX2
          #               就只生成 avx2 一档, ssse3/sse2 全缺。
          # 即 "声明三档、只定义一档", 两处门控口径不一致, 必须手工对齐。
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_GEMMOLOGY=ON \
            -DUSE_AVX2=ON \
            -DUSE_SSSE3=ON \
            -DUSE_SSE2=ON \
            -DUSE_BUILTIN_SENTENCEPIECE=OFF
          cmake --build build --parallel
          echo "--- 产物:"
          find build -maxdepth 3 -type f -executable -name 'slimt*' -print
          find build -name 'libslimt*' -print

      # 模型来源: 官方 mozilla/firefox-translations-models 已 archived,
      # 且 LFS 对象被服务器清除(batch API 返回 410), 指针在但实体没了。
      # 改用 HF 镜像 mukowaty/firefox-translations —— 其 model.zhen 为
      # 44369188 字节, 与官方 LFS 指针记录的 size 完全一致, 同一份文件。
      #
      # ⚠️ 中英只有 base 档, 没有 tiny 档(tiny/ 下 84 个语向均无中文)。
      # 而 slimt README 明确写着 "`base` models are planned"(即尚未支持),
      # 其内置下载器 `slimt download -m <pair>-tiny` 也只认 tiny 后缀。
      # 参数表虽然列了 base 的 emb 512 / ffn 2048 / 39.0M / 38MB(i8),
      # 但那是模型规格说明, 不等于 slimt 已实现对它的加载。
      # → 这是 G4.1 最可能不通过的点, 若加载失败即触发 §1.2 bergamot 回退。
      - name: 下载中英 base 模型
        run: |
          set -euo pipefail
          BASE='https://huggingface.co/mukowaty/firefox-translations/resolve/main'
          DIR="$RUNNER_TEMP/models"

          # ⚠️ 仓库里存的就是 .gz 文件本身(HF 不会按需解压, 也不会自动补后缀),
          # 故 URL 必须显式带 .gz —— 上一轮漏了它, 直接 404。
          # 已用 HF API(/api/models/<repo>, 415 个文件)核对过真实路径形态:
          #   zh-en/model.zhen.intgemm.alphas.bin.gz  单 vocab: vocab.zhen.spm.gz
          #   en-zh/model.enzh.intgemm.alphas.bin.gz  双 vocab: src/trgvocab.enzh.spm.gz
          # 另有 zh_hant 繁体语向与每个语向的 model.json, 本轮不用。
          fetch() {
            local rel="$1" dest="$2"
            mkdir -p "$(dirname "$dest")"
            echo "拉取 ${rel}.gz"
            curl -fsSL --retry 3 --retry-delay 2 -o "${dest}.gz" "${BASE}/${rel}.gz"
            gzip -dc "${dest}.gz" > "$dest"
            rm -f "${dest}.gz"
            ls -l "$dest"
          }

          # zh-en: 单 vocab
          fetch 'zh-en/model.zhen.intgemm.alphas.bin' "$DIR/zhen/model.zhen.intgemm.alphas.bin"
          fetch 'zh-en/vocab.zhen.spm'                "$DIR/zhen/vocab.zhen.spm"
          fetch 'zh-en/lex.50.50.zhen.s2t.bin'        "$DIR/zhen/lex.50.50.zhen.s2t.bin"

          # en-zh: src/trg 双 vocab —— 与 zh-en 形态不同, 加载代码须两种都支持
          fetch 'en-zh/model.enzh.intgemm.alphas.bin' "$DIR/enzh/model.enzh.intgemm.alphas.bin"
          fetch 'en-zh/srcvocab.enzh.spm'             "$DIR/enzh/srcvocab.enzh.spm"
          fetch 'en-zh/trgvocab.enzh.spm'             "$DIR/enzh/trgvocab.enzh.spm"
          fetch 'en-zh/lex.50.50.enzh.s2t.bin'        "$DIR/enzh/lex.50.50.enzh.s2t.bin"

          echo "--- 解压后实际体积(判定 §5 下载流量与 §7 速度门禁基线):"
          du -sh "$DIR"/*
          du -ah "$DIR" | sort -k2
      # 下载 marian 的 nonbreaking_prefixes 供实验 2 使用。
      # slimt 的 load_splitter 对空 prefix_path 只打一条 warn 就返回空 splitter,
      # 所以不喂这个文件的话, 即使把 --split-mode 改成 paragraph 也切不了句。
      - name: 下载 ssplit 前缀表 (实验 2 用)
        continue-on-error: true
        run: |
          set -uo pipefail
          DIR="$RUNNER_TEMP/models"
          # ssplit-cpp 的英文 nonbreaking prefixes
          for u in \
            'https://raw.githubusercontent.com/ugermann/ssplit-cpp/master/nonbreaking_prefixes/nonbreaking_prefix.en' \
            'https://raw.githubusercontent.com/marian-nmt/moses-scripts/master/share/nonbreaking_prefixes/nonbreaking_prefix.en'
          do
            echo "尝试: $u"
            if curl -fsSL --retry 2 -o "$DIR/nonbreaking_prefix.en" "$u"; then
              echo "  [ok] 命中"
              wc -l "$DIR/nonbreaking_prefix.en"
              break
            fi
          done
          ls -l "$DIR/nonbreaking_prefix.en" 2>/dev/null || echo "前缀表未取到, 实验 2 将退化为无 splitter"

      # slimt-cli 的参数形态需从实际 --help 确认, 不照抄文档。
      # 这一步单独跑是为了: 即使后面翻译失败, 日志里也留下了正确的用法,
      # 下一轮迭代不必再猜。
      - name: 探明 slimt-cli 用法
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/slimt"
          CLI="$(find build -maxdepth 3 -type f -executable -name 'slimt*' | head -1)"
          test -n "$CLI"
          echo "CLI=$CLI" >> "$GITHUB_ENV"
          echo "--- $CLI --help:"
          "$CLI" --help 2>&1 || true

      # 对照实验 3: 用 slimt 官方支持的 en-de tiny 跑一遍, 建立引擎行为基线。
      #
      # ⚠️ 上一轮这里用了 `$CLI download -m en-de-tiny`, 但 slimt-cli **没有**
      # download 子命令, 也没有 -m 短选项(--help 实测只有 --root/--model/
      # --vocabulary/--shortlist 一组显式路径参数)。CLI11 报
      # "The following arguments were not expected: en-de-tiny -m download",
      # 退出码 109 —— 对照证据整轮作废。本轮改为手动下载 + 显式路径。
      - name: 对照组 en-de tiny (slimt 官方支持档位)
        id: control
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          D="$RUNNER_TEMP/ende"
          B='https://huggingface.co/mukowaty/firefox-translations/resolve/main/en-de'
          mkdir -p "$D"
          for f in model.ende.intgemm.alphas.bin vocab.deen.spm lex.50.50.ende.s2t.bin; do
            curl -fsSL --retry 2 -o "$D/$f.gz" "$B/$f.gz" && gzip -df "$D/$f.gz" && echo "  [ok] $f"
          done
          ls -l "$D" || true
          echo "--- en->de 单句(与实验 1 同口径):"
          printf 'Hello world.\n' | "$CLI" \
            --root "$D" \
            --model model.ende.intgemm.alphas.bin \
            --vocabulary vocab.deen.spm \
            --shortlist lex.50.50.ende.s2t.bin 2>&1
          echo "对照组退出码: $?"

      # ============================================================
      # 实验 1 — 单句输入（直接判据）
      # ============================================================
      # 上一轮 zh-en 首句正确、次句重复退化: "Artificial intelligence is
      # changing the world. It's changing the world. It"。
      #
      # 已排除架构参数假设: Model.cc 中 preset::base() 与 preset::tiny()
      # 参数完全相同(6/2/2/8), 且日志里只有两条良性 warn(Wemb_QuantMultA /
      # special:model.yml), 无任何 decoder_l3/l4 的 "Failed to ingest"。
      # Bergamot base 与 tiny 差在**宽度**不是深度, 实际层数由权重 shape 读。
      #
      # 根因: split_mode 默认 "sentence" -> OneSentencePerLine, 把单行两句
      # 当**一句**送进解码器。模型本身训练分布是单句, 超出后逐步失稳。
      #
      # 本实验分句输入: 若单句干净, 则 base 档可用, 只需 Dart 侧按句喂 ——
      # 恰好与 TtsService._splitSentences(。！？!?；;) 天然契合。
      - name: 实验 1 — 单句输入 (zh-en base)
        id: exp1
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          D="$RUNNER_TEMP/models/zhen"
          echo "每行一句, 避免 split_mode=sentence 把多句当一句处理:"
          printf '人工智能正在改变世界。\n这是一个测试句子。\n科技改变生活。\n' | \
            "$CLI" \
              --root "$D" \
              --model model.zhen.intgemm.alphas.bin \
              --vocabulary vocab.zhen.spm \
              --shortlist lex.50.50.zhen.s2t.bin 2>&1
          echo "--- 退出码: $?"

      # ============================================================
      # 实验 2 — 多句 + splitter（确认切分链路）
      # ============================================================
      # 验证 slimt 能否通过 --ssplit + --split-mode paragraph 自行切句。
      # 决定 Dart 侧要不要承担切句责任。上一轮 ssplit 空 -> load_splitter
      # 只打 warn 返回空 splitter, paragraph 模式也切不了句。
      - name: 实验 2 — 多句单行 + splitter (zh-en base)
        id: exp2
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/slimt"
          D="$RUNNER_TEMP/models/zhen"
          PREFIX="$RUNNER_TEMP/models/nonbreaking_prefix.en"
          if [ -f "$PREFIX" ]; then
            echo "用 splitter + paragraph 模式处理多句单行:"
            printf '人工智能正在改变世界。这是一个测试句子。科技改变生活。' | \
              "$CLI" \
                --root "$D" \
                --model model.zhen.intgemm.alphas.bin \
                --vocabulary vocab.zhen.spm \
                --shortlist lex.50.50.zhen.s2t.bin \
                --ssplit "$PREFIX" \
                --split-mode paragraph 2>&1
            echo "--- 退出码: $?"
          else
            echo "前缀表未取到, 跳过实验 2"
          fi

      # en-zh 双 vocab 已从源码坐实结构性不通, 本轮不再浪费步骤重跑:
      #   Model.hh:24-26      struct Package 只有单个 vocabulary 字段
      #   Model.hh:79         Model 内部也只持有一个 vocabulary_
      #   Vocabulary.hh:16-17 构造函数只接受单个 fpath/View
      #   app/main.cc:45      CLI 只有一个 --vocabulary(单值 option, 后值覆盖)
      # 上一轮实测两路均乱码(srcvocab: ", NTT,ty per. 70:18 per";
      # trgvocab: ", NTT,不可分割的更多Kan Computing珊瑚, , ,"), 与分析一致。
      #
      # 改为探路: 是否存在**单 vocab** 的英中语向可替代。
      # 这条关系到 OCR->朗读的主场景(en->zh), 是 slimt 路线的核心风险。
      - name: 探路 — 是否有单 vocab 的英中语向
        id: probe
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "枚举 HF 镜像里所有含 zh 的语向及其 vocab 形态:"
          curl -fsSL 'https://huggingface.co/api/models/mukowaty/firefox-translations' \
            | tr ',' '\n' | grep -o '"rfilename":"[^"]*"' \
            | sed 's/"rfilename":"//;s/"$//' \
            | grep -E '(^|/)(en-zh|zh-en|en-zh_hant|zh_hant-en)/' \
            | sort || echo "枚举失败"
          echo
          echo "判据: 若某英中语向只有单个 vocab.*.spm(无 src/trg 分离),"
          echo "则该语向可直接喂进 slimt, en->zh 主场景有解。"

      - name: G4.1 门禁判定
        if: always()
        run: |
          echo "实验 1 (单句 zh-en):  ${{ steps.exp1.outcome }}"
          echo "实验 2 (splitter):    ${{ steps.exp2.outcome }}"
          echo "实验 3 (en-de 对照):  ${{ steps.control.outcome }}"
          echo "探路 (英中单 vocab):  ${{ steps.probe.outcome }}"
          echo
          echo "门禁标准(docs/13 §G4.1): 译文正确性由人工看上面日志判定,"
          echo "退出码 0 只是必要条件 —— 上一轮三路全 rc=0 但两路是乱码。"
          echo
          echo "本轮关键判据:"
          echo "  实验 1 单句干净 => base 档在 slimt 上可用, 上层按句喂即可;"
          echo "  实验 1 仍退化   => 与切分无关, 触发 §1.2 bergamot 回退;"
          echo "  实验 3 若也退化 => 问题在引擎多句处理, 与 base 档无关。"

