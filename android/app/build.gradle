plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// 签名信息从环境变量读取（CI 中由 GitHub Secrets 注入）。
// 与 Hermes Studio Mobile 的签名方案保持一致：
//   - Secrets 已配置 → 使用 release 签名（稳定、可覆盖安装）
//   - 未配置（本地构建/首次 CI）→ 回退 debug 签名，保证构建不失败
def keystorePath = System.getenv("KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

def hasSigningConfig = keystorePath != null && !keystorePath.isEmpty() &&
        keystorePassword != null && !keystorePassword.isEmpty() &&
        envKeyAlias != null && !envKeyAlias.isEmpty() &&
        envKeyPassword != null && !envKeyPassword.isEmpty()

android {
    namespace = "com.example.speak_reader"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.example.speak_reader"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Keep shrinking disabled until the reproducible baseline build passes.
            minifyEnabled false
            shrinkResources false
            signingConfig = hasSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
