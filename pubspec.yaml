name: speak_reader
description: 语音朗读导入 App —— 拍照/扫描/Word/PDF/TXT 导入并语音朗读
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 语音朗读(系统内置 TTS)
  flutter_tts: 4.0.2

  # 拍照 / 相册取图
  image_picker: ^1.1.2

  # 选择文件(docx/pdf/txt)
  file_picker: ^8.1.2

  # Word(.docx)转文本
  docx_to_text: ^1.0.1

  # PDF 文本层提取(Android 基于 PDFBox)
  flutter_pdf_text: 0.9.0

  # [v2.5.0] PDF 原文真实渲染(翻页/缩放/页码, Android 基于 AndroidPdfViewer)
  flutter_pdfview: 1.4.4

  # [v2.5.0] 端侧 GGUF 推理引擎(llama.cpp Dart FFI 绑定)
  # 选型: llama_cpp_dart 0.2.2 —— 兼容 Flutter 3.22.3/Dart 3.4.4,
  # 支持多模态视觉(mtmd/mmproj, Sprint 8 离线 OCR 硬需求),
  # 原生库走 GitHub release 预编译 jni(免 CI 编译 C++, 见 scripts/download_llama_libs.sh)
  llama_cpp_dart: 0.2.2

  # [v2.5.0] 扫描版 PDF 逐页渲染为图片(离线 OCR 用, Sprint 8)
  # 选型: pdf_render 1.4.12 —— 兼容 Dart >=2.17/Flutter >=1.20(与锁定环境兼容),
  # Android 基于自研渲染器, 无第三方 so, 不拖累 APK 体积
  pdf_render: 1.4.12

  # [v2.5.0] RGBA → PNG 编码(与 llama_cpp_dart 传递依赖 image 4.5.4 一致)
  image: 4.5.4

  # 运行时权限
  permission_handler: ^11.3.1

  # 历史记录本地持久化
  shared_preferences: ^2.3.2

  # 网络请求(翻译 API)
  http: ^1.2.2

  # 文件目录(音频导出输出路径)
  path_provider: ^2.1.4
  path: 1.9.0

  # 分享/打开生成的音频文件
  # 需 >=10.0.1 才依赖 web ^1.0.0(与 file_picker 兼容);
  # 又需 <12.0.0 避免强制 AGP>=8.12/Kotlin2.2 拖累 CI。
  share_plus: ^10.1.0

  # [v2.4.0] 移除: google_mlkit_translation/google_mlkit_language_id (~15MB,国产机不可用)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # [v2.5.0] 测试: 替换 path_provider 平台实现(固定文档目录)
  # ^2.1.2 兼容锁定 Dart 3.4.4/Flutter 3.22.3(2.1.3 起要求 Dart ^3.10)
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
