name: speak_reader
description: 语音朗读导入 App —— 拍照/扫描/Word/PDF/TXT 导入并语音朗读
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 语音朗读(系统内置 TTS)
  flutter_tts: ^4.0.2

  # 拍照 / 相册取图
  image_picker: ^1.1.2

  # 选择文件(docx/pdf/txt)
  file_picker: ^8.1.2

  # Word(.docx)转文本
  docx_to_text: ^1.0.1

  # PDF 文本提取(轻量替代,基于 pdfium,无 Syncfusion 原生代码膨胀)
  pdfx: ^2.6.0

  # 运行时权限
  permission_handler: ^11.3.1

  # 历史记录本地持久化
  shared_preferences: ^2.3.2

  # 网络请求(翻译 API)
  http: ^1.2.2

  # 文件目录(音频导出输出路径)
  path_provider: ^2.1.4

  # 分享/打开生成的音频文件
  # 需 >=10.0.1 才依赖 web ^1.0.0(与 file_picker 兼容);
  # 又需 <12.0.0 避免强制 AGP>=8.12/Kotlin2.2 拖累 CI。
  share_plus: ^10.1.0

  # [v2.4.0] 移除: google_mlkit_translation/google_mlkit_language_id (~15MB,国产机不可用)

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
